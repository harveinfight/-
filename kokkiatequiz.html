<head>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* 横並びを保持するコンテナ */
        .quiz-layout {
            display: flex !important;
            flex-direction: row !important;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        /* 左側：メインクイズエリア */
        .quiz-main {
            flex: 1 1 0%;
            min-width: 280px;
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
        }

        .quiz-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin: 0 0 5px 0;
        }

        .quiz-subtitle {
            font-size: 13px;
            color: #888;
            margin: 0 0 20px 0;
        }

        .flag-box {
            width: 180px;
            height: 115px;
            margin: 0 auto 25px auto;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .flag-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .btn-option {
            background-color: #ffffff;
            color: #2B547E;
            border: 2px solid #2B547E;
            border-radius: 10px;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-option:hover:not(:disabled) {
            background-color: #2B547E;
            color: #ffffff;
            transform: translateY(-2px);
        }

        .btn-option:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-option.correct-choice {
            background-color: #2e7d32 !important;
            border-color: #2e7d32 !important;
            color: white !important;
        }

        .btn-option.wrong-choice {
            background-color: #c62828 !important;
            border-color: #c62828 !important;
            color: white !important;
        }

        .result-message {
            margin-top: 15px;
            font-size: 15px;
            font-weight: bold;
            min-height: 24px;
        }

        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }

        .btn-next {
            margin-top: 15px;
            background-color: #2B547E;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            display: none;
            transition: background 0.2s;
        }

        .btn-next:hover {
            background-color: #1e3c5a;
        }

        /* 右側：サイドバー */
        .mode-sidebar {
            width: 220px;
            flex-shrink: 0;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .mode-sidebar h3 {
            margin: 0 0 10px 0;
            font-size: 15px;
            color: #2B547E;
            text-align: center;
            border-bottom: 2px solid #2B547E;
            padding-bottom: 8px;
        }

        .btn-mode {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            font-weight: bold;
            color: #334155;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .btn-mode:hover {
            background: #f1f5f9;
            border-color: #2B547E;
            transform: translateX(3px);
        }

        .btn-mode.active {
            background: #2B547E;
            color: #ffffff;
            border-color: #2B547E;
            box-shadow: 0 2px 8px rgba(43, 84, 126, 0.3);
        }

        @media (max-width: 600px) {
            .quiz-layout {
                flex-direction: column-reverse !important;
            }
            .mode-sidebar {
                width: 100%;
            }
        }
        

.ad-banner {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 12px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    width: 100%;            /* 横幅いっぱいにフィット */
    max-width: 100px;       /* 枠の最大幅 */
    box-sizing: border-box; /* パディングを含めたサイズ計算 */
    overflow: hidden;       /* ★枠外へのはみ出しを強力にガード！ */
}

.ad-banner:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(0,0,0,0.1);
}

.ad-label {
    font-size: 10px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 8px;
    display: block;
}

.ad-banner a {
    display: block;
    text-decoration: none;

}

/* 📢 画像本体のサイズ調整 */
.ad-banner img {
    width: 100% !important;        /* 横幅を枠にピッタリ合わせます */
    height: auto !important;       /* 縦横比を綺麗に維持 */
    max-height: 200px !important;  /* ★お好みの高さ制限（例: 150px や 200px） */
    object-fit: contain;           /* 画像を潰さずに綺麗に収めます */
    border-radius: 8px;
    display: block;
    margin: 0 auto;
}

    let currentCorrectCountry = null;
    let currentMode = 1; // 初期値：アジア (123~176)

    // モードごとのID範囲定義
    function getRangesByMode(mode) {
        switch (mode) {
            case 1:
                return [{ min: 60, max: 113 }]; // アジア
            case 2:
                return [{ min: 114, max: 172 }];    // ヨーロッパ
            case 3:
                return [{ min: 60, max: 172 }];  // ユーラシア
            case 4:
                return [{ min: 1, max: 59 }];  // アフリカ
            case 5:
                return [{ min: 173, max: 213 }];  // 北アメリカ
            case 6:
                return [{ min: 214, max: 228 }];  // 南アメリカ
            case 7:
                return [{ min: 173, max: 228 }];  // アメリカ大陸    
            case 8:
                return [{ min: 229, max: 256 }];  // オセアニア   
            case 9:
                return [{ min: 257, max: 261 }];  // その他
                
            default:
                return [{ min: 1, max: 9999 }];  // 全世界
        }
    }

    // モード切替処理
    function changeMode(modeNumber, clickedBtn) {
        currentMode = modeNumber;

        const allModeButtons = document.querySelectorAll('.btn-mode');
        allModeButtons.forEach(btn => btn.classList.remove('active'));

        if (clickedBtn) {
            clickedBtn.classList.add('active');
        }

        generateRandomQuestion();
    }

    // シャッフル関数
    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // ID範囲チェック
    function isCountryInAllowedRanges(country, ranges) {
        if (!country || country.id === undefined) return false;
        const id = Number(country.id);
        return ranges.some(range => id >= range.min && id <= range.max);
    }

    // 問題作成処理
    function generateRandomQuestion() {
        if (!countryList || countryList.length === 0) return;

        const allowedRanges = getRangesByMode(currentMode);
        const filteredCountryList = countryList.filter(country => 
            isCountryInAllowedRanges(country, allowedRanges)
        );

        if (filteredCountryList.length === 0) {
            document.getElementById('result-text').innerText = '該当する地域のデータがありませんわ！';
            document.getElementById('result-text').className = 'result-message wrong';
            document.getElementById('flag-image').src = '';
            document.getElementById('options-container').innerHTML = '';
            return;
        }

        // 画面リセット
        document.getElementById('result-text').innerText = '';
        document.getElementById('result-text').className = 'result-message';
        document.getElementById('next-btn').style.display = 'none';

        // 正解決定
        const targetIndex = Math.floor(Math.random() * filteredCountryList.length);
        currentCorrectCountry = filteredCountryList[targetIndex];

        // 画像設定
        const imagePath = currentCorrectCountry.flagPath || currentCorrectCountry.flag || "";
        document.getElementById('flag-image').src = imagePath;

        // 不正解のダミー取得
        const wrongOptions = [];
        let safetyCounter = 0;
        const maxWrongCount = Math.min(3, filteredCountryList.length - 1);

        while (wrongOptions.length < maxWrongCount && safetyCounter < 1000) {
            safetyCounter++;
            const randIndex = Math.floor(Math.random() * filteredCountryList.length);
            const candidate = filteredCountryList[randIndex];
            
            if (candidate && candidate.id !== currentCorrectCountry.id) {
                const isAlreadyPicked = wrongOptions.some(item => item.id === candidate.id);
                if (!isAlreadyPicked) {
                    wrongOptions.push(candidate);
                }
            }
        }

        // 選択肢作成
        const correctName = currentCorrectCountry.name || currentCorrectCountry.countryName || "不明";
        let choices = [{ name: correctName, isCorrect: true }];

        wrongOptions.forEach(country => {
            const wrongName = country.name || country.countryName || "";
            if (wrongName) {
                choices.push({ name: wrongName, isCorrect: false });
            }
        });

        choices = shuffleArray(choices);

        // ボタン生成
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        choices.forEach(choice => {
            const button = document.createElement('button');
            button.className = 'btn-option';
            button.innerText = choice.name;
            button.onclick = () => checkAnswer(button, choice.isCorrect);
            optionsContainer.appendChild(button);
        });
    }

    // 正誤判定処理
    function checkAnswer(clickedButton, isCorrect) {
        const resultText = document.getElementById('result-text');
        const allButtons = document.querySelectorAll('.btn-option');

        allButtons.forEach(btn => btn.disabled = true);

        const correctName = currentCorrectCountry.name || currentCorrectCountry.countryName || "";

        if (isCorrect) {
            clickedButton.classList.add('correct-choice');
            resultText.innerText = "正解ですわ！お見事です！🎉";
            resultText.className = 'result-message correct';
        } else {
            clickedButton.classList.add('wrong-choice');
            resultText.innerText = `残念！正解は「${correctName}」ですわ！`;
            resultText.className = 'result-message wrong';

            allButtons.forEach(btn => {
                if (btn.innerText === correctName) {
                    btn.classList.add('correct-choice');
                }
            });
        }

        document.getElementById('next-btn').style.display = 'block';
    }

    // 初回起動
    generateRandomQuestion();
