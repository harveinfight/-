    <title>国旗クイズですわあああぁぁぁ</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .quiz-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .quiz-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .quiz-subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
        }

        .flag-box {
            width: 180px;
            height: 115px;
            margin: 0 auto 25px auto;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .flag-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .btn-option {
            background-color: #ffffff;
            color: #2B547E;
            border: 2px solid #2B547E;
            border-radius: 10px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-option:hover:not(:disabled) {
            background-color: #2B547E;
            color: #ffffff;
            transform: translateY(-2px);
        }

        .btn-option:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-option.correct-choice {
            background-color: #2e7d32 !important;
            border-color: #2e7d32 !important;
            color: white !important;
        }

        .btn-option.wrong-choice {
            background-color: #c62828 !important;
            border-color: #c62828 !important;
            color: white !important;
        }

        .result-message {
            margin-top: 20px;
            font-size: 16px;
            font-weight: bold;
            min-height: 25px;
        }

        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }

        .btn-next {
            margin-top: 20px;
            background-color: #2B547E;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            display: none;
            transition: background 0.2s;
        }

        .btn-next:hover {
            background-color: #1e3c5a;
        }
    </style>
</head>

        let currentCorrectCountry = null;

        // ランダムシャッフル関数
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 問題生成関数
        function generateRandomQuestion() {
            if (!countryList || countryList.length === 0) return;

            // リセット処理
            document.getElementById('result-text').innerText = '';
            document.getElementById('result-text').className = 'result-message';
            document.getElementById('next-btn').style.display = 'none';

            // 1. 正解の国を確定
            const targetIndex = Math.floor(Math.random() * countryList.length);
            currentCorrectCountry = countryList[targetIndex];

            // 2. 国旗画像の反映
            const imagePath = currentCorrectCountry.flagPath || currentCorrectCountry.flag || "";
            document.getElementById('flag-image').src = imagePath;

            // 3. 不正解（ダミー）の選択肢を3つ取得
            const wrongOptions = [];
            let safetyCounter = 0;

            while (wrongOptions.length < 3 && safetyCounter < 1000) {
                safetyCounter++;
                const randIndex = Math.floor(Math.random() * countryList.length);
                const candidate = countryList[randIndex];
                
                if (candidate && candidate.id !== currentCorrectCountry.id) {
                    const isAlreadyPicked = wrongOptions.some(item => item.id === candidate.id);
                    if (!isAlreadyPicked) {
                        wrongOptions.push(candidate);
                    }
                }
            }

            // 4. 選択肢配列の作成
            const correctName = currentCorrectCountry.name || currentCorrectCountry.countryName || "不明";
            let choices = [
                { name: correctName, isCorrect: true }
            ];

            wrongOptions.forEach(country => {
                const wrongName = country.name || country.countryName || "";
                if (wrongName) {
                    choices.push({ name: wrongName, isCorrect: false });
                }
            });

            // シャッフル
            choices = shuffleArray(choices);

            // 5. ボタン生成
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            choices.forEach(choice => {
                const button = document.createElement('button');
                button.className = 'btn-option';
                button.innerText = choice.name;
                button.onclick = () => checkAnswer(button, choice.isCorrect);
                optionsContainer.appendChild(button);
            });
        }

        // 判定関数
        function checkAnswer(clickedButton, isCorrect) {
            const resultText = document.getElementById('result-text');
            const allButtons = document.querySelectorAll('.btn-option');

            allButtons.forEach(btn => btn.disabled = true);

            const correctName = currentCorrectCountry.name || currentCorrectCountry.countryName || "";

            if (isCorrect) {
                clickedButton.classList.add('correct-choice');
                resultText.innerText = "正解ですわ！お見事です！🎉";
                resultText.classList.add('correct');
            } else {
                clickedButton.classList.add('wrong-choice');
                resultText.innerText = `残念！正解は「${correctName}」ですわ！`;
                resultText.classList.add('wrong');

                allButtons.forEach(btn => {
                    if (btn.innerText === correctName) {
                        btn.classList.add('correct-choice');
                    }
                });
            }

            document.getElementById('next-btn').style.display = 'block';
        }

        // 初回スタート
        generateRandomQuestion();
    </script>
